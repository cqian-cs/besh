[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "besh"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = []
authors = [
  { name = "cqian-cs", email = "cqian.cs@qq.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = []

[project.urls]
Documentation = "https://github.com/cqian-cs/besh#readme"
Issues = "https://github.com/cqian-cs/besh/issues"
Source = "https://github.com/cqian-cs/besh"

[tool.hatch.version]
path = "src/besh/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/besh tests}"

[tool.coverage.run]
source_pkgs = ["besh", "tests"]
branch = true
parallel = true
omit = [
  "src/besh/__about__.py",
]

[tool.coverage.paths]
besh = ["src/besh", "*/besh/src/besh"]
tests = ["tests", "*/besh/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
