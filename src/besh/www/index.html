<!DOCTYPE html>
<!-- generated by besh · 由 `besh serve` 写入，可直接改 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>besh · Beacon Shell</title>
<style>
  :root {
    --bg: #0d1117;
    --bg-soft: #161b22;
    --bg-soft2: #1c2129;
    --line: #30363d;
    --fg: #e6edf3;
    --fg-dim: #8b949e;
    --fg-dim2: #6e7681;
    --accent: #58a6ff;
    --ok: #3fb950;
    --bad: #f85149;
    --warn: #d29922;
    --term-bg: #010409;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 16px;
    background: var(--bg-soft);
    border-bottom: 1px solid var(--line);
    flex: 0 0 auto;
  }
  .brand { font-weight: 700; letter-spacing: .5px; }
  .brand span { color: var(--accent); }
  .pill {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid var(--line);
    color: var(--fg-dim);
  }
  .pill.ok { color: var(--ok); border-color: #1f6f34; }
  .pill.bad { color: var(--bad); border-color: #5f1f1f; }
  .spacer { flex: 1 1 auto; }
  button {
    background: var(--bg-soft2);
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
  }
  button:hover { border-color: #4d5866; background: #222833; }
  button:active { transform: translateY(1px); }
  button.primary { background: #1f6feb; border-color: #1f6feb; }
  button.primary:hover { background: #2b7cf5; }
  button.ghost { background: transparent; }
  button.tiny { padding: 2px 7px; font-size: 11px; }
  main { flex: 1 1 auto; display: flex; min-height: 0; }

  /* 左侧工人列表 */
  aside {
    width: 244px;
    flex: 0 0 244px;
    border-right: 1px solid var(--line);
    background: var(--bg-soft);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .panel-title {
    padding: 8px 12px;
    font-size: 11px;
    letter-spacing: .8px;
    text-transform: uppercase;
    color: var(--fg-dim2);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .worker-list { overflow: auto; flex: 1 1 auto; }
  .worker {
    padding: 8px 12px;
    border-bottom: 1px solid #21262d;
    cursor: pointer;
    display: flex;
    gap: 8px;
    align-items: flex-start;
  }
  .worker:hover { background: #1b2230; }
  .worker.active { background: #1f6feb22; border-left: 2px solid var(--accent); padding-left: 10px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; margin-top: 6px; flex: 0 0 auto; background: var(--fg-dim2); }
  .dot.on { background: var(--ok); box-shadow: 0 0 6px #3fb95088; }
  .worker .name { font-weight: 600; }
  .worker .meta { color: var(--fg-dim2); font-size: 11px; word-break: break-all; }

  /* 右侧主区 */
  section.main { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .tabs {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
    background: var(--bg-soft);
    overflow-x: auto;
  }
  .tab {
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid transparent;
    color: var(--fg-dim);
    cursor: pointer;
    white-space: nowrap;
  }
  .tab:hover { background: var(--bg-soft2); }
  .tab.active { background: var(--bg-soft2); border-color: var(--line); color: var(--fg); }
  .tab .x { color: var(--fg-dim2); margin-left: 6px; }
  .tab .x:hover { color: var(--bad); }

  .term-wrap { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; padding: 10px 12px 0; }
  #term {
    flex: 1 1 auto;
    margin: 0;
    overflow: auto;
    background: var(--term-bg);
    border: 1px solid var(--line);
    border-radius: 8px 8px 0 0;
    padding: 10px 12px;
    font: 12.5px/1.45 "SFMono-Regular", Menlo, Consolas, "DejaVu Sans Mono", "Noto Sans Mono CJK SC", monospace;
    white-space: pre;
    tab-size: 4;
    color: #c9d1d9;
  }
  .inputbar {
    display: flex;
    gap: 6px;
    align-items: center;
    padding: 8px 0 10px;
    border: 1px solid var(--line);
    border-top: none;
    border-radius: 0 0 8px 8px;
    background: var(--bg-soft);
    padding-left: 8px;
    padding-right: 8px;
    flex-wrap: wrap;
  }
  #cmd {
    flex: 1 1 240px;
    background: var(--term-bg);
    border: 1px solid var(--line);
    color: var(--fg);
    border-radius: 6px;
    padding: 6px 9px;
    font: 12.5px/1.4 "SFMono-Regular", Menlo, Consolas, monospace;
    outline: none;
  }
  #cmd:focus { border-color: var(--accent); }
  .keys { display: flex; gap: 4px; }

  /* 文件面板 */
  .files {
    flex: 0 0 34%;
    max-height: 34%;
    border-top: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--bg-soft);
  }
  .files-head { display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-bottom: 1px solid var(--line); }
  .files-head input[type="date"] {
    background: var(--bg-soft2); color: var(--fg); border: 1px solid var(--line);
    border-radius: 5px; padding: 3px 6px; font-family: inherit; font-size: 12px;
  }
  .file-list { overflow: auto; flex: 1 1 auto; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; color: var(--fg-dim2); font-weight: 500; padding: 5px 12px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg-soft); }
  td { padding: 4px 12px; border-bottom: 1px solid #21262d; color: var(--fg-dim); }
  td.path { color: var(--fg); font-family: "SFMono-Regular", Menlo, Consolas, monospace; }
  tr:hover td { background: #1b2230; }
  .empty { padding: 14px 12px; color: var(--fg-dim2); }

  #toast {
    position: fixed; right: 16px; bottom: 16px; max-width: 46ch;
    background: #1c2129; border: 1px solid var(--line); border-left: 3px solid var(--accent);
    padding: 9px 12px; border-radius: 6px; color: var(--fg); font-size: 12px;
    opacity: 0; transform: translateY(8px); transition: .18s; pointer-events: none;
    white-space: pre-wrap; z-index: 20;
  }
  #toast.show { opacity: 1; transform: none; }
  #toast.bad { border-left-color: var(--bad); }
  #toast.ok { border-left-color: var(--ok); }

  #login {
    position: fixed; inset: 0; background: #0d1117ee; display: flex;
    align-items: center; justify-content: center; z-index: 30;
  }
  #login .box { background: var(--bg-soft); border: 1px solid var(--line); border-radius: 10px; padding: 22px; width: 340px; }
  #login h2 { margin: 0 0 6px; font-size: 15px; }
  #login p { color: var(--fg-dim); margin: 0 0 14px; font-size: 12px; }
  #login input { width: 100%; padding: 7px 9px; background: var(--term-bg); border: 1px solid var(--line); color: var(--fg); border-radius: 6px; margin-bottom: 10px; font-family: inherit; }
  .hint { color: var(--fg-dim2); font-size: 11px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="brand">besh<span>·</span>beacon</div>
  <span id="ver" class="pill">-</span>
  <span id="store" class="pill">storage -</span>
  <div class="spacer"></div>
  <button id="btn-refresh" title="刷新工人与窗口列表">刷新</button>
  <button id="btn-backup" class="primary" title="立刻备份工作目录到对象存储">备份</button>
</header>

<main>
  <aside>
    <div class="panel-title">工人 <span id="wcount" class="hint"></span></div>
    <div class="worker-list" id="workers"></div>
  </aside>

  <section class="main">
    <div class="tabs" id="tabs"></div>
    <div class="term-wrap">
      <pre id="term">选择一个工人开始。</pre>
      <div class="inputbar">
        <input id="cmd" placeholder="输入命令后回车 ↵" autocomplete="off" spellcheck="false" />
        <button class="primary" id="btn-send">发送</button>
        <div class="keys">
          <button class="tiny" data-key="C-c" title="Ctrl-C">^C</button>
          <button class="tiny" data-key="C-d" title="Ctrl-D">^D</button>
          <button class="tiny" data-key="Tab" title="Tab">Tab</button>
          <button class="tiny" data-key="Up" title="↑">↑</button>
          <button class="tiny" data-key="Down" title="↓">↓</button>
          <button class="tiny" data-key="Escape" title="Esc">Esc</button>
        </div>
      </div>
    </div>

    <div class="files">
      <div class="files-head">
        <span class="panel-title" style="border:0;padding:0">对象存储</span>
        <input type="date" id="date" />
        <button class="tiny" id="btn-files">列出</button>
        <span class="hint" id="files-info"></span>
        <div class="spacer"></div>
        <input type="file" id="upload" class="hidden" multiple />
        <button class="tiny" id="btn-upload">上传</button>
      </div>
      <div class="file-list" id="files"></div>
    </div>
  </section>
</main>

<div id="toast"></div>

<div id="login" class="hidden">
  <div class="box">
    <h2>连接信标</h2>
    <p>输入信标密钥（即 besh_secret）。</p>
    <input id="login-secret" type="password" placeholder="secret" />
    <button class="primary" id="btn-login" style="width:100%">连接</button>
    <p class="hint" style="margin-top:12px">也可以用 <code>?secret=xxx</code> 打开本页面。</p>
  </div>
</div>

<script>
"use strict";

/* ---------------------------------------------------------------- 状态 */
const S = {
  secret: "",
  workers: [],
  worker: "",
  window: "",
  date: "",
  live: true,
  panes: {},
  busy: false,
  lastHash: "",
};

const $ = (id) => document.getElementById(id);

/* ---------------------------------------------------------------- 工具 */
function esc(s) {
  return String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

function toast(msg, kind) {
  const el = $("toast");
  el.textContent = msg;
  el.className = "show " + (kind || "");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => (el.className = ""), kind === "bad" ? 6000 : 2600);
}

function fmtSize(n) {
  n = Number(n || 0);
  const u = ["B", "KB", "MB", "GB", "TB"];
  let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i === 0 ? n.toFixed(0) : n.toFixed(1)) + u[i];
}

/* ---------------------------------------------------------------- ANSI */
const FG = {
  30: "#6e7681", 31: "#ff7b72", 32: "#3fb950", 33: "#d29922", 34: "#58a6ff",
  35: "#bc8cff", 36: "#39c5cf", 37: "#c9d1d9",
  90: "#8b949e", 91: "#ffa198", 92: "#56d364", 93: "#e3b341", 94: "#79c0ff",
  95: "#d2a8ff", 96: "#56d4dd", 97: "#f0f6fc",
};
const BG = {
  40: "#161b22", 41: "#5a1e1e", 42: "#1b4721", 43: "#4d2d00", 44: "#0c2d6b",
  45: "#3c1e6e", 46: "#0b3d44", 47: "#30363d",
  100: "#484f58", 101: "#8e1519", 102: "#2ea043", 103: "#9e6a03", 104: "#1f6feb",
  105: "#8957e5", 106: "#1f6feb", 107: "#6e7681",
};

function ansiToHtml(raw) {
  // 去掉 OSC 与非 SGR 的 CSI，避免在页面上出现乱码
  let text = String(raw || "")
    .replace(/\x1b\][^\x07\x1b]*(\x07|\x1b\\)/g, "")
    .replace(/\x1b\[[0-9;?]*[^0-9;m]/g, "")
    .replace(/\x1b[()][A-Za-z0-9]/g, "")
    .replace(/\x1b[=>]/g, "");

  let out = "";
  let fg = "", bg = "", bold = false;
  const re = /\x1b\[([0-9;]*)m/g;
  let last = 0, m;
  const paint = (chunk) => {
    if (!chunk) return "";
    let st = "";
    if (fg) st += "color:" + fg + ";";
    if (bg) st += "background:" + bg + ";";
    if (bold) st += "font-weight:700;";
    return st ? '<span style="' + st + '">' + esc(chunk) + "</span>" : esc(chunk);
  };
  while ((m = re.exec(text))) {
    out += paint(text.slice(last, m.index));
    const codes = (m[1] || "0").split(";").map((x) => parseInt(x || "0", 10));
    if (!m[1]) codes.push(0);
    for (const c of codes) {
      if (c === 0) { fg = ""; bg = ""; bold = false; }
      else if (c === 1) bold = true;
      else if (c === 22) bold = false;
      else if (c === 39) fg = "";
      else if (c === 49) bg = "";
      else if (FG[c]) fg = FG[c];
      else if (BG[c]) bg = BG[c];
    }
    last = re.lastIndex;
  }
  out += paint(text.slice(last));
  return out;
}

/* ---------------------------------------------------------------- API */
async function api(f, params) {
  const body = Object.assign({ f: f }, params || {});
  let resp;
  try {
    resp = await fetch("/api", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + S.secret },
      body: JSON.stringify(body),
    });
  } catch (e) {
    throw new Error("连不上信标：" + e.message);
  }
  if (resp.status === 401 || resp.status === 403) {
    askLogin();
    throw new Error("密钥不正确");
  }
  if (!resp.ok) throw new Error("HTTP " + resp.status);
  const data = await resp.json();
  if (data && data.suc === false) throw new Error(data.msg || data.data || "操作失败");
  return data;
}

/* ---------------------------------------------------------------- 登录 */
function askLogin() {
  $("login").classList.remove("hidden");
  $("login-secret").focus();
}

function saveSecret(value) {
  S.secret = value.trim();
  try { localStorage.setItem("besh_secret", S.secret); } catch (e) {}
  $("login").classList.add("hidden");
}

/* ---------------------------------------------------------------- 工人 */
function renderWorkers() {
  const box = $("workers");
  if (!S.workers.length) {
    box.innerHTML = '<div class="empty">还没有工人。<br>在闲置算力上运行：<br><code>besh worker WORKER_ID</code></div>';
    $("wcount").textContent = "";
    return;
  }
  box.innerHTML = S.workers.map((w) => {
    const act = w.worker === S.worker ? " active" : "";
    const meta = (w.online ? "在线" : "离线") + " · " + (w.host || "-");
    return (
      '<div class="worker' + act + '" data-worker="' + esc(w.worker) + '">' +
      '<span class="dot ' + (w.online ? "on" : "") + '"></span>' +
      '<div><div class="name">' + esc(w.worker) + "</div>" +
      '<div class="meta">' + esc(meta) + "</div>" +
      '<div class="meta">' + esc(w.cwd || "") + "</div></div></div>"
    );
  }).join("");
  $("wcount").textContent = S.workers.filter((w) => w.online).length + "/" + S.workers.length;
  box.querySelectorAll(".worker").forEach((el) => {
    el.onclick = () => selectWorker(el.dataset.worker);
  });
}

function currentWorker() {
  return S.workers.find((w) => w.worker === S.worker) || null;
}

async function loadWorkers() {
  const ret = await api("list_workers");
  S.workers = ret.data || [];
  if (!S.worker && S.workers.length) {
    selectWorker(S.workers[0].worker);
    return;
  }
  if (S.worker && !S.workers.some((w) => w.worker === S.worker)) {
    S.worker = S.workers.length ? S.workers[0].worker : "";
    S.window = "";
  }
  renderWorkers();
  renderTabs();
}

function selectWorker(name) {
  if (S.worker === name && S.window) return;
  S.worker = name;
  S.window = "";
  S.lastHash = "";
  renderWorkers();
  loadWindows(true);
  loadFiles();
  $("term").textContent = "读取窗口…";
}

/* ---------------------------------------------------------------- 窗口 */
function renderTabs() {
  const box = $("tabs");
  const w = currentWorker();
  if (!w) {
    box.innerHTML = '<span class="hint">没有选中的工人</span>';
    return;
  }
  const windows = w.windows || [];
  box.innerHTML =
    windows.map((n) =>
      '<span class="tab' + (n === S.window ? " active" : "") + '" data-win="' + esc(n) + '">' + esc(n) + "</span>"
    ).join("") +
    '<button class="tiny" id="btn-newwin" title="新建窗口">+ 窗口</button>';
  box.querySelectorAll(".tab").forEach((el) => {
    el.onclick = () => { S.window = el.dataset.win; S.lastHash = ""; renderTabs(); pollPane(true); };
  });
  $("btn-newwin").onclick = async () => {
    const name = prompt("新窗口名（字母数字，如 gpu）", "win" + Math.floor(Math.random() * 90 + 10));
    if (!name) return;
    try {
      await api("new_window", { worker: S.worker, window: name, command: "" });
      S.window = name;
      S.lastHash = "";
      await loadWindows(true);
      toast("已创建窗口 " + name, "ok");
    } catch (e) { toast(e.message, "bad"); }
  };
}

async function loadWindows(refresh) {
  if (!S.worker) return;
  try {
    const ret = await api("list_windows", { worker: S.worker, refresh: refresh ? 1 : 0, timeout: 6 });
    const wins = ret.data || [];
    const w = currentWorker();
    if (w) w.windows = wins.map((x) => x.name);
    if (!S.window || !wins.some((x) => x.name === S.window)) {
      const active = wins.find((x) => x.active) || wins[0];
      S.window = active ? active.name : "";
    }
    renderTabs();
    renderWorkers();
    if (S.window) pollPane(true);
  } catch (e) {
    toast(e.message, "bad");
  }
}

/* ---------------------------------------------------------------- 终端 */
async function pollPane(force) {
  if (!S.worker || !S.window || S.busy) return;
  try {
    const ret = await api("capture_pane", {
      worker: S.worker,
      window: S.window,
      lines: 200,
      escapes: 1,
      refresh: force ? 1 : 0,
    });
    const content = ret.content || "";
    const hash = content.length + ":" + content.slice(-300);
    if (force || hash !== S.lastHash) {
      S.lastHash = hash;
      const term = $("term");
      term.innerHTML = ansiToHtml(content) || '<span style="color:#6e7681">(空)</span>';
      term.scrollTop = term.scrollHeight;
    }
  } catch (e) {
    if (!S.busy) $("term").textContent = "· " + e.message;
  }
}

async function sendText() {
  const input = $("cmd");
  const text = input.value;
  if (!S.worker) { toast("先选择一个工人", "bad"); return; }
  if (!S.window) { toast("先选择一个窗口", "bad"); return; }
  input.value = "";
  S.busy = true;
  try {
    await api("type_text", { worker: S.worker, window: S.window, text: text, enter: 1 });
    await new Promise((r) => setTimeout(r, 160));
    await pollPane(true);
    setTimeout(() => pollPane(true), 500);
  } catch (e) {
    toast(e.message, "bad");
  } finally {
    S.busy = false;
    input.focus();
  }
}

async function sendKey(key) {
  if (!S.worker || !S.window) { toast("先选择工人和窗口", "bad"); return; }
  try {
    await api("send_keys", { worker: S.worker, window: S.window, keys_json: JSON.stringify([key]) });
    await new Promise((r) => setTimeout(r, 120));
    await pollPane(true);
  } catch (e) { toast(e.message, "bad"); }
}

/* ---------------------------------------------------------------- 文件 */
async function loadFiles() {
  if (!S.worker) return;
  const date = $("date").value || S.date;
  $("files-info").textContent = "读取中…";
  try {
    const ret = await api("storage_files", { worker: S.worker, date: date });
    const rows = ret.data || [];
    $("files-info").textContent = (ret.remote || "") + " · " + rows.length + " 个文件";
    if (!rows.length) {
      $("files").innerHTML = '<div class="empty">这一天还没有备份。点右上角「备份」立即上传，或等待 besh_sync 定时同步。</div>';
      return;
    }
    $("files").innerHTML =
      "<table><thead><tr><th>大小</th><th>修改时间</th><th>路径</th><th></th></tr></thead><tbody>" +
      rows.map((r, i) =>
        "<tr><td>" + fmtSize(r.size) + "</td><td>" + esc(r.mtime || "-") + "</td>" +
        '<td class="path">' + esc(r.path) + "</td>" +
        '<td style="text-align:right;white-space:nowrap">' +
        '<button class="tiny" data-dl="' + i + '">下载</button> ' +
        '<button class="tiny" data-del="' + i + '">删</button></td></tr>'
      ).join("") + "</tbody></table>";
    $("files").querySelectorAll("[data-dl]").forEach((el) => {
      el.onclick = () => downloadFile(rows[Number(el.dataset.dl)].path);
    });
    $("files").querySelectorAll("[data-del]").forEach((el) => {
      el.onclick = () => removeFile(rows[Number(el.dataset.del)].path);
    });
  } catch (e) {
    $("files-info").textContent = "";
    $("files").innerHTML = '<div class="empty">' + esc(e.message) + "</div>";
  }
}

async function downloadFile(path) {
  toast("生成下载链接…");
  try {
    const ret = await api("storage_link", { worker: S.worker, path: path, date: $("date").value });
    if (ret.url) { window.open(ret.url, "_blank"); return; }
    const got = await api("storage_get", { worker: S.worker, path: path, date: $("date").value });
    const bin = atob(got.b64 || "");
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([arr]));
    const a = document.createElement("a");
    a.href = url;
    a.download = path.split("/").pop();
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  } catch (e) {
    toast(e.message, "bad");
  }
}

async function removeFile(path) {
  if (!confirm("删除对象存储里的 " + path + " ？")) return;
  try {
    await api("storage_delete", { worker: S.worker, path: path, date: $("date").value });
    toast("已删除", "ok");
    loadFiles();
  } catch (e) { toast(e.message, "bad"); }
}

function readAsB64(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(String(fr.result).split(",", 2)[1] || "");
    fr.onerror = () => reject(new Error("读取文件失败"));
    fr.readAsDataURL(file);
  });
}

async function handleUpload(files) {
  if (!S.worker) { toast("先选择一个工人", "bad"); return; }
  for (const file of files) {
    if (file.size > 16 * 1024 * 1024) { toast(file.name + " 超过 16MB，请用 rclone", "bad"); continue; }
    toast("上传 " + file.name + "…");
    try {
      const b64 = await readAsB64(file);
      await api("storage_put", {
        worker: S.worker, path: file.name, b64: b64, date: $("date").value,
      });
      toast("已上传 " + file.name, "ok");
    } catch (e) { toast(e.message, "bad"); }
  }
  loadFiles();
}

/* ---------------------------------------------------------------- 启动 */
async function bootstrap() {
  const params = new URLSearchParams(location.search);
  const fromUrl = params.get("secret");
  let saved = "";
  try { saved = localStorage.getItem("besh_secret") || ""; } catch (e) {}
  S.secret = fromUrl || saved;
  if (fromUrl) {
    try { localStorage.setItem("besh_secret", fromUrl); } catch (e) {}
    params.delete("secret");
    const q = params.toString();
    history.replaceState(null, "", location.pathname + (q ? "?" + q : ""));
  }
  if (!S.secret) { askLogin(); return; }

  $("date").value = new Date().toISOString().slice(0, 10);
  S.date = $("date").value;

  try {
    const info = await api("hello");
    $("ver").textContent = "v" + (info.version || "?");
    const st = $("store");
    st.textContent = "storage " + (info.storage ? "ok" : "缺失");
    st.className = "pill " + (info.storage ? "ok" : "bad");
    st.title = info.remote || "";
  } catch (e) {
    toast(e.message, "bad");
    if (/密钥|401|403/.test(e.message)) askLogin();
    return;
  }

  await loadWorkers();
  setInterval(() => { if (!document.hidden) loadWorkers().catch(() => {}); }, 5000);
  setInterval(() => { if (!document.hidden && S.live) pollPane(false); }, 1200);
}

$("btn-send").onclick = sendText;
$("cmd").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); sendText(); }
  else if (e.key === "ArrowUp" && !$("cmd").value) { e.preventDefault(); sendKey("Up"); }
  else if (e.key === "ArrowDown" && !$("cmd").value) { e.preventDefault(); sendKey("Down"); }
});
document.querySelectorAll("[data-key]").forEach((el) => {
  el.onclick = () => sendKey(el.dataset.key);
});
$("btn-refresh").onclick = () => { loadWorkers().then(() => loadWindows(true)).catch((e) => toast(e.message, "bad")); };
$("btn-backup").onclick = async () => {
  if (!S.worker) { toast("先选择一个工人", "bad"); return; }
  toast("正在备份 " + S.worker + " …");
  try {
    const ret = await api("backup", { worker: S.worker, wait: 40 });
    toast((ret.output || "备份完成").slice(-400), "ok");
    loadFiles();
  } catch (e) { toast(e.message, "bad"); }
};
$("btn-files").onclick = loadFiles;
$("date").onchange = loadFiles;
$("btn-upload").onclick = () => $("upload").click();
$("upload").onchange = (e) => { handleUpload(Array.from(e.target.files || [])); e.target.value = ""; };
$("btn-login").onclick = () => { saveSecret($("login-secret").value); bootstrap(); };
$("login-secret").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { saveSecret($("login-secret").value); bootstrap(); }
});

bootstrap();
</script>
